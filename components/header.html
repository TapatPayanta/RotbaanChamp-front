<header class="bg-[color:var(--deep-olive)]">

    <div class="mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">

            <!-- left: logo + title -->
            <div class="flex items-center gap-4">
                <!-- logo (bigger on desktop) -->
                <img src="/assets/header.png" alt="Rotbaan Champ" class="w-28 md:w-32 h-auto" />

                <!-- title -->
                <div class="hidden sm:block">
                    <span class="text-[#EFE6DD] text-2xl md:text-3xl font-bold leading-none">รถบ้านแชมป์</span>
                </div>
            </div>

            <!-- desktop nav -->
            <nav aria-label="Global" class="hidden md:block">
                <ul class="flex items-center gap-10 text-xl">
                    <li><a href="/index.html" class="text-[#EFE6DD] hover:text-[#C77C64]">หน้าแรก</a></li>
                    <li><a href="/about.html" class="text-[#EFE6DD] hover:text-[#C77C64]">เกี่ยวกับ</a></li>
                    <li><a href="/contact.html" class="text-[#EFE6DD] hover:text-[#C77C64]">ติดต่อ</a></li>
                </ul>
            </nav>

            <!-- mobile controls -->
            <div class="flex items-center gap-2 md:hidden">

                <!-- a compact text title for small screens -->
                <div class="block sm:hidden">
                    <span class="text-[#EFE6DD] text-lg font-semibold">รถบ้านแชมป์</span>
                </div>

                <!-- hamburger toggle -->
                <button id="mobile-nav-toggle" aria-expanded="false" aria-controls="mobile-nav"
                    class="p-2.5 rounded-md bg-transparent text-[#EFE6DD]" title="Open menu">
                    <!-- open icon -->
                    <svg id="hamburger-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <!-- close icon (hidden initially) -->
                    <svg id="hamburger-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- mobile nav panel (positioned below header) -->
    <div id="mobile-nav"
        class="hidden md:hidden absolute right-4 top-16 z-50 bg-[color:var(--dark-charcoal)] text-[#EFE6DD] rounded-2xl shadow-2xl ring-1 ring-black/30 p-2 w-[13rem]">
        <nav aria-label="Mobile">
            <ul class="space-y-1 text-sm">
                <li>
                    <a href="/index.html" class="block rounded-md px-3 py-2">
                        หน้าแรก
                    </a>
                </li>
                <li>
                    <a href="/about.html" class="block rounded-md px-3 py-2">
                        เกี่ยวกับ
                    </a>
                </li>
                <li>
                    <a href="/contact.html" class="block rounded-md px-3 py-2">
                        ติดต่อ
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</header>
